---
layout: default
---

<div class="section-title">
    <span>Category</span>
    <h2>{{ page.category }}</h2>
</div>

{% for post in site.posts %}

{% if post.category == page.category %}

<article class="post">

    <div class="post-info">

        <span class="category">
            {{ post.category }}
        </span>

        <h3>
            <a href="{{ post.url }}">
                {{ post.title }}
            </a>
        </h3>

        <div class="date">
            {{ post.date | date: "%B %d, %Y" }}
        </div>

        <p>
            {{ post.excerpt }}
        </p>

        <div class="tags">

            {% for tag in post.tags %}
            <span>{{ tag }}</span>
            {% endfor %}

        </div>

    </div>

    <div class="post-image">
    <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
</div>

</article>

{% endif %}

{% endfor %}
