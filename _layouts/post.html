---
layout: default
---

<article class="post-page">

    <a class="category"
       href="/categories/{{ page.category | slugify }}/">
        {{ page.category }}
    </a>

    <h1>{{ page.title }}</h1>

    <div class="date">
        {{ page.date | date: "%B %d, %Y" }}
    </div>

    <div class="tags">
        {% for tag in page.tags %}
        <span>{{ tag }}</span>
        {% endfor %}
    </div>

    <div class="post-content">
        {{ content }}
    </div>

</article>
