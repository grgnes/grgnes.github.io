---
layout: default
title: Posts
---

<div class="section-title">
    <span>Posts</span>
    <h2>All Write-ups</h2>
</div>

{% for post in site.posts %}

<article class="post">

    <div class="post-info">

        <a class="category"
           href="/categories/{{ post.category | slugify }}/">

            {{ post.category }}

        </a>

        <h3>
            <a href="{{ post.url }}">
                {{ post.title }}
            </a>
        </h3>

        <div class="date">
            {{ post.date | date: "%B %d, %Y" }}
        </div>

        <p>
            {{ post.excerpt }}
        </p>

        <div class="tags">

            {% for tag in post.tags %}
            <span>{{ tag }}</span>
            {% endfor %}

        </div>

    </div>

    <div class="post-image">
        IMAGE
    </div>

</article>

{% endfor %}
