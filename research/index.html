---
layout: default
title: Research
---

<div class="section-title">
    <span>Research</span>
    <h2>Security Research</h2>
</div>

{% for post in site.posts %}

{% if post.category == "Research" %}

<article class="post">

    <div class="post-info">

        <a class="category" href="/research/">
            Research
        </a>

        <h3>
            <a href="{{ post.url }}">
                {{ post.title }}
            </a>
        </h3>

        <div class="date">
            {{ post.date | date: "%B %d, %Y" }}
        </div>

        <p>
            {{ post.excerpt }}
        </p>

        <div class="tags">
            {% for tag in post.tags %}
            <span>{{ tag }}</span>
            {% endfor %}
        </div>

    </div>

    <div class="post-image">
        <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
    </div>

</article>

{% endif %}

{% endfor %}
