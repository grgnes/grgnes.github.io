---
layout: default
title: Home
---


<section>

    <div class="section-title">
        <span>Home</span>
        <h2>Recent Posts</h2>
    </div>

    {% for post in site.posts limit:5 %}

    <article class="post">

        <div class="post-info">

            <a class="category"
            href="/categories/{{ post.category | slugify }}/"
                {{ post.category }}

            </a>

            <h3>

                <a href="{{ post.url }}">

                    {{ post.title }}

                </a>

            </h3>

            <div class="date">

                {{ post.date | date: "%B %d, %Y" }}

            </div>

            <p>

                {{ post.excerpt | strip_html | truncate:150 }}

            </p>

            <div class="tags">

                {% for tag in post.tags %}

                <span>{{ tag }}</span>

                {% endfor %}

            </div>

        </div>

        <div class="post-image">

            IMAGE

        </div>

    </article>

    {% endfor %}

</section>
